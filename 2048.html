<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game - AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .cell {
            transition: all 0.15s ease-in-out;
        }
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; }
        .tile-256 { background: #edcc61; color: #f9f6f2; }
        .tile-512 { background: #edc850; color: #f9f6f2; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.4); }
        .tile-super { background: #3c3a32; color: #f9f6f2; }
        .new-tile {
            animation: appear 0.2s ease-in-out;
        }
        .merged {
            animation: pop 0.2s ease-in-out;
        }
        @keyframes appear {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .swap-hint {
            animation: guide 0.8s ease-in-out infinite;
        }
        @keyframes guide {
            0%, 100% { transform: translate(0, 0); opacity: 0.3; }
            50% { transform: translate(3px, -3px); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-4xl font-bold text-gray-800">2048</h1>
            <div class="text-right">
                <p class="text-sm text-gray-500">Score</p>
                <p id="score" class="text-2xl font-bold text-gray-800">0</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex gap-2 mb-4">
            <button onclick="undo()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition">
                Undo
            </button>
            <button onclick="suggestMove()" class="flex-1 bg-purple-500 hover:bg-purple-600 text-white font-medium py-2 px-4 rounded-lg transition">
                Next Move
            </button>
            <button onclick="resetGame()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg transition">
                New Game
            </button>
        </div>

        <!-- Hint display -->
        <div id="hint" class="mb-4 p-3 bg-purple-100 border border-purple-300 rounded-lg text-purple-800 text-center hidden">
            Suggested: <span id="hint-direction" class="font-bold"></span>
        </div>

        <!-- Game Board -->
        <div class="bg-gray-300 p-4 rounded-xl shadow-lg select-none">
            <div class="grid grid-cols-4 gap-3 mb-4" id="grid">
                <!-- Grid cells generated by JS -->
            </div>
        </div>

        <!-- Instructions -->
        <div class="mt-4 text-sm text-gray-600 space-y-2">
            <p class="font-semibold">Controls:</p>
            <p>• Use <kbd class="px-2 py-1 bg-gray-200 rounded text-xs font-mono">←</kbd> <kbd class="px-2 py-1 bg-gray-200 rounded text-xs font-mono">↑</kbd> <kbd class="px-2 py-1 bg-gray-200 rounded text-xs font-mono">→</kbd> <kbd class="px-2 py-1 bg-gray-200 rounded text-xs font-mono">↓</kbd> arrow keys</p>
            <p>• Click "Undo" to revert last move</p>
            <p>• Click "Next Move" for AI suggestion</p>
            <p>• Merge tiles to reach <strong class="text-2xl font-bold text-yellow-600">2048</strong>!</p>
        </div>

        <!-- Game Over / Win -->
        <div id="game-over" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
            <div class="bg-white p-8 rounded-2xl shadow-2xl text-center max-w-sm">
                <h2 id="game-title" class="text-3xl font-bold mb-4"></h2>
                <p id="game-message" class="text-gray-600 mb-6"></p>
                <button onclick="resetGame()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-xl text-lg transition">
                    Play Again
                </button>
            </div>
        </div>
    </div>

    <script>
        // Game state
        const size = 4;
        let board = [];
        let score = 0;
        let history = [];
        let hintDirection = null;

        // Initialize
        function init() {
            board = Array(size).fill(null).map(() => Array(size).fill(0));
            score = 0;
            history = [];
            addRandomTile();
            addRandomTile();
            render();
            updateScore();

            // Keyboard events
            window.addEventListener('keydown', handleKeydown);
        }

        // Add random tile (2 or 4)
        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) empty.push([r, c]);
                }
            }
            if (empty.length === 0) return;
            const [r, c] = empty[Math.floor(Math.random() * empty.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        // Render board
        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const value = board[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'cell bg-gray-200 rounded-lg h-20 flex items-center justify-center text-3xl font-bold';

                    if (value > 0) {
                        cell.classList.add('tile-' + (value <= 2048 ? value : 'super'));
                        cell.textContent = value;
                    }

                    // Show hint arrow
                    if (hintDirection && value === 0) {
                        const hintCell = document.createElement('div');
                        hintCell.className = 'absolute text-4xl text-purple-500 opacity-50 swap-hint';
                        hintCell.innerHTML = '←↓↑→'[getArrowIndex(hintDirection)];
                        hintCell.style.position = 'absolute';
                        cell.appendChild(hintCell);
                    }

                    grid.appendChild(cell);
                }
            }
        }

        function getArrowIndex(dir) {
            const dirs = ['left', 'down', 'up', 'right'];
            return dirs.indexOf(dir);
        }

        // Move handling
        function move(dir) {
            // Save state for undo
            const snapshot = JSON.parse(JSON.stringify(board));
            const oldScore = score;

            let moved = false;
            const vectors = {
                'left': [0, -1],
                'right': [0, 1],
                'up': [-1, 0],
                'down': [1, 0]
            };
            const vec = vectors[dir];

            // Traverse in correct order
            const traversals = buildTraversals(dir);

            for (let r of traversals.r) {
                for (let c of traversals.c) {
                    const cell = { r, c };
                    const tile = board[r][c];
                    if (tile === 0) continue;

                    const positions = findFarthestPosition(cell, vec);
                    const next = getCellContent(positions.next);

                    // Merge
                    if (next && next === tile && !positions.merged) {
                        const merged = tile * 2;
                        board[positions.next.r][positions.next.c] = merged;
                        board[r][c] = 0;
                        score += merged;
                        positions.merged = true;
                        moved = true;
                    } else {
                        board[positions.farthest.r][positions.farthest.c] = tile;
                        if (r !== positions.farthest.r || c !== positions.farthest.c) {
                            board[r][c] = 0;
                            moved = true;
                        }
                    }
                }
            }

            if (moved) {
                history.push({ board: snapshot, score: oldScore, hintDirection });
                if (history.length > 20) history.shift();
                addRandomTile();
                updateScore();
                render();
                checkGameOver();
            }

            hintDirection = null;
            document.getElementById('hint').classList.add('hidden');
        }

        function buildTraversals(dir) {
            const result = { r: [], c: [] };
            for (let i = 0; i < size; i++) {
                result.r.push(i);
                result.c.push(i);
            }
            if (dir === 'right') result.c.reverse();
            if (dir === 'down') result.r.reverse();
            return result;
        }

        function findFarthestPosition(cell, vec) {
            let previous;
            do {
                previous = cell;
                cell = { r: previous.r + vec[0], c: previous.c + vec[1] };
            } while (
                cell.r >= 0 && cell.r < size &&
                cell.c >= 0 && cell.c < size &&
                board[cell.r][cell.c] === 0
            );
            return {
                farthest: previous,
                next: cell,
                merged: false
            };
        }

        function getCellContent(cell) {
            if (cell.r < 0 || cell.r >= size || cell.c < 0 || cell.c >= size) return null;
            return board[cell.r][cell.c];
        }

        // Undo
        function undo() {
            if (history.length === 0) return;
            const state = history.pop();
            board = state.board;
            score = state.score;
            hintDirection = state.hintDirection;
            render();
            updateScore();
            if (hintDirection) {
                document.getElementById('hint-direction').textContent = hintDirection;
                document.getElementById('hint').classList.remove('hidden');
            } else {
                document.getElementById('hint').classList.add('hidden');
            }
            document.getElementById('game-over').classList.add('hidden');
        }

        // Reset
        function resetGame() {
            init();
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('hint').classList.add('hidden');
            history = [];
        }

        // Score
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // Keyboard
        function handleKeydown(e) {
            const keyMap = {
                'ArrowLeft': 'left',
                'ArrowRight': 'right',
                'ArrowUp': 'up',
                'ArrowDown': 'down'
            };
            if (keyMap[e.key]) {
                e.preventDefault();
                move(keyMap[e.key]);
                document.getElementById('hint').classList.add('hidden');
            }
        }

        // Game over check
        function checkGameOver() {
            // Check for 2048 win (game continues but we show win)
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 2048) {
                        showGameOver(true);
                        return;
                    }
                }
            }

            // Check if any moves possible
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) return false; // Empty cell exists
                    for (let [dr, dc] of [[0,1],[1,0]]) {
                        const nr = r + dr, nc = c + dc;
                        if (nr < size && nc < size && board[nr][nc] === board[r][c]) {
                            return false; // Merge possible
                        }
                    }
                }
            }
            showGameOver(false);
            return true;
        }

        function showGameOver(won) {
            const modal = document.getElementById('game-over');
            const title = document.getElementById('game-title');
            const msg = document.getElementById('game-message');
            title.textContent = won ? 'You Win! 🎉' : 'Game Over!';
            title.className = won ? 'text-3xl font-bold mb-4 text-green-600' : 'text-3xl font-bold mb-4 text-red-600';
            msg.textContent = won ? `Final Score: ${score}` : `Score: ${score}`;
            modal.classList.remove('hidden');
        }

        // ======================
        // AI: Next best move
        // ======================

        function suggestMove() {
            const moves = ['left', 'right', 'up', 'down'];
            let bestMove = null;
            let bestScore = -Infinity;
            const depth = 3; // Depth for expectimax

            // Evaluate each move
            for (let move of moves) {
                const testBoard = JSON.parse(JSON.stringify(board));
                const testScore = score;
                const simResult = simulateMove(testBoard, testScore, move);

                if (!simResult.moved) continue;

                // Use expectimax algorithm
                const evalScore = expectimax(simResult.board, depth - 1, false);
                const totalScore = simResult.score + evalScore;

                if (totalScore > bestScore) {
                    bestScore = totalScore;
                    bestMove = move;
                }
            }

            if (bestMove) {
                hintDirection = bestMove;
                document.getElementById('hint-direction').textContent = bestMove.toUpperCase();
                document.getElementById('hint').classList.remove('hidden');

                // Animate arrow on board
                render();

                // Flash effect on hint box
                const hintEl = document.getElementById('hint');
                hintEl.classList.add('bg-purple-300');
                setTimeout(() => hintEl.classList.remove('bg-purple-300'), 300);
            } else {
                document.getElementById('hint-direction').textContent = 'No good moves!';
                document.getElementById('hint').classList.remove('hidden');
            }
        }

        // Simulate a move without affecting game state
        function simulateMove(boardCopy, scoreCopy, dir) {
            const size = 4;
            const vectors = { 'left': [0, -1], 'right': [0, 1], 'up': [-1, 0], 'down': [1, 0] };
            const vec = vectors[dir];
            const traversals = buildTraversals(dir);
            let moved = false;

            for (let r of traversals.r) {
                for (let c of traversals.c) {
                    const tile = boardCopy[r][c];
                    if (tile === 0) continue;

                    let pos = { r, c };
                    let farthest;
                    while (true) {
                        farthest = pos;
                        pos = { r: farthest.r + vec[0], c: farthest.c + vec[1] };
                        if (pos.r < 0 || pos.r >= size || pos.c < 0 || pos.c >= size) break;
                        if (boardCopy[pos.r][pos.c] !== 0) break;
                    }

                    const next = (pos.r >= 0 && pos.r < size && pos.c >= 0 && pos.c < size) ? boardCopy[pos.r][pos.c] : null;
                    if (next && next === tile) {
                        boardCopy[farthest.r][farthest.c] = 0;
                        boardCopy[pos.r][pos.c] = tile * 2;
                        scoreCopy += tile * 2;
                        moved = true;
                    } else if (farthest.r !== r || farthest.c !== c) {
                        boardCopy[farthest.r][farthest.c] = tile;
                        boardCopy[r][c] = 0;
                        moved = true;
                    }
                }
            }

            return { board: boardCopy, score: scoreCopy, moved };
        }

        // Expectimax algorithm
        function expectimax(board, depth, isPlayerTurn) {
            if (depth === 0) return evaluateBoard(board);

            if (isPlayerTurn) {
                // Maximize: try all 4 moves
                const moves = ['left', 'right', 'up', 'down'];
                let maxEval = -Infinity;
                for (let move of moves) {
                    const sim = simulateMove(JSON.parse(JSON.stringify(board)), 0, move);
                    if (!sim.moved) continue;
                    const evalScore = expectimax(sim.board, depth - 1, false);
                    maxEval = Math.max(maxEval, sim.score + evalScore);
                }
                return maxEval === -Infinity ? evaluateBoard(board) : maxEval;
            } else {
                // Expectation: average over possible tile placements
                const emptyCells = [];
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (board[r][c] === 0) emptyCells.push([r, c]);
                    }
                }
                if (emptyCells.length === 0) return evaluateBoard(board);

                let totalEval = 0;
                // New tile is 90% chance of 2, 10% chance of 4
                for (let [r, c] of emptyCells) {
                    const boardCopy = JSON.parse(JSON.stringify(board));
                    boardCopy[r][c] = 2;
                    totalEval += expectimax(boardCopy, depth - 1, true) * 0.9;

                    boardCopy[r][c] = 4;
                    totalEval += expectimax(boardCopy, depth - 1, true) * 0.1;
                }
                return totalEval / emptyCells.length;
            }
        }

        // Evaluation function
        function evaluateBoard(board) {
            let score = 0;
            const weightPositions = [
                [6, 5, 4, 3],
                [5, 3, 2, 1],
                [4, 2, 1, 0],
                [3, 1, 0, -1]
            ];

            const monotonicityBonus = () => {
                let total = 0;
                // Rows left-to-right
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size - 1; c++) {
                        const current = board[r][c] === 0 ? 0 : Math.log2(board[r][c]);
                        const next = board[r][c+1] === 0 ? 0 : Math.log2(board[r][c+1]);
                        total -= Math.abs(current - next);
                    }
                }
                // Columns top-to-bottom
                for (let c = 0; c < size; c++) {
                    for (let r = 0; r < size - 1; r++) {
                        const current = board[r][c] === 0 ? 0 : Math.log2(board[r][c]);
                        const next = board[r+1][c] === 0 ? 0 : Math.log2(board[r+1][c]);
                        total -= Math.abs(current - next);
                    }
                }
                return total;
            };

            const smoothness = () => {
                let total = 0;
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (board[r][c] === 0) continue;
                        for (let [dr, dc] of [[0,1],[1,0]]) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < size && nc >= 0 && nc < size && board[nr][nc] !== 0) {
                                const val1 = Math.log2(board[r][c]);
                                const val2 = Math.log2(board[nr][nc]);
                                total -= Math.abs(val1 - val2);
                            }
                        }
                    }
                }
                return total;
            };

            // Positional bonus: encourage keeping high tiles in corners
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] > 0) {
                        score += (board[r][c] * weightPositions[r][c]) * 10;
                    }
                }
            }

            score += monotonicityBonus() * 5;
            score += smoothness() * 3;

            // Bonus for empty cells
            let empty = 0;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) empty++;
                }
            }
            score += empty * 100;

            return score;
        }

        // Start game
        init();
    </script>
</body>
</html>
